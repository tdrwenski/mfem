# Continuous benchmarking with CodSpeed (https://codspeed.io). Builds the
# benchmarks in tests/benchmarks against CodSpeed's instrumented Google
# Benchmark fork (MFEM_USE_CODSPEED) and runs the selected benchmark(s) under
# the CodSpeed measurement harness, reporting results to codspeed.io.
name: CodSpeed Benchmarks

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # Needed for CodSpeed tokenless (OIDC) authentication on public repos.
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MFEM
        uses: actions/checkout@v4

      - name: Configure and build MFEM benchmark
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DMFEM_USE_BENCHMARK=YES \
            -DMFEM_USE_CODSPEED=YES \
            -DCODSPEED_MODE=simulation
          cmake --build build --target bench_vector -j"$(nproc)"

      - name: Run benchmarks with CodSpeed
        uses: CodSpeedHQ/action@v4
        with:
          mode: simulation
          run: ./build/tests/benchmarks/bench_vector
